name: OIV design toolchain
on:
  push:
    branches: [tools/oiv-design-install-20260923]
    paths: ['.github/workflows/design-toolchain.yml', 'tools/design/**', 'docs/**']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  install-and-inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
      - name: Install and exercise the eight requested repositories
        run: bash tools/design/install.sh
      - name: Preserve exact command results, tool binaries and real Iris captures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: oiv-tool-installation
          path: tool-evidence/
          retention-days: 3
          compression-level: 3
