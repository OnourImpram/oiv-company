name: OIV site checks
on:
  push:
    branches: [main]
    paths: ['docs/**', 'tests/**', '.github/workflows/site-checks.yml']
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: oiv-site-checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the exact revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Validate both languages and deployment metadata
        run: python3 -m unittest discover -s tests -v
      - name: Verify the published pages and assets
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: python3 tests/check_live.py
